name: Release Binaries

on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the toolchain
        run: rustup toolchain install

      # A release can only read caches saved on main, so the pushes to main keep this one warm.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --release --locked --bin dotk-indexer

      - name: Compress
        if: github.event_name == 'release'
        run: gzip -c target/release/dotk-indexer > dotk-indexer-${{ matrix.arch }}.gz

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dotk-indexer-${{ matrix.arch }}.gz
